name: bodiana
description: Bodiana – Bengali wedding planning and vendor marketplace.
publish_to: 'none'

# Bump the number after + for every Play Store upload (versionCode).
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
