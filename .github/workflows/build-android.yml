name: Build Android app

# Builds the APK (for testing / sharing) and the AAB (for Google Play).
# Runs on every push to main, or manually from the Actions tab.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
# Optional:
#   PRIVACY_POLICY_URL
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   (create these with the "Create upload keystore" workflow; needed for Play Store uploads)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check server settings
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning title=Supabase not configured::Add SUPABASE_URL and SUPABASE_ANON_KEY repository secrets. This build will show a 'no server connection' screen."
          fi

      - name: Generate Android project
        run: |
          flutter create --org com.bodiana --project-name bodiana --platforms android .
          python3 scripts/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build APK and App Bundle
        run: |
          DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL"
          flutter build apk --release $DEFINES --build-number=${{ github.run_number }}
          flutter build appbundle --release $DEFINES --build-number=${{ github.run_number }}
          mkdir -p dist

      - name: Sign with your upload key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks upload.jks --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/bodiana-${{ github.run_number }}.apk build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/bodiana-${{ github.run_number }}-playstore.aab
          zip -q -d dist/bodiana-${{ github.run_number }}-playstore.aab 'META-INF/*' || true
          jarsigner -keystore upload.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            dist/bodiana-${{ github.run_number }}-playstore.aab "$ANDROID_KEY_ALIAS"
          "$BT/apksigner" verify dist/bodiana-${{ github.run_number }}.apk
          rm upload.jks

      - name: Test-signed build (no upload key yet)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning title=Not signed for Play Store::The APK installs fine for testing, but add the ANDROID_KEYSTORE_* secrets before uploading to Google Play."
          cp build/app/outputs/flutter-apk/app-release.apk dist/bodiana-${{ github.run_number }}-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bodiana-android-${{ github.run_number }}
          path: dist/
          retention-days: 30
