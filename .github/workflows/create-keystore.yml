name: Create upload keystore (run once)

# Creates the private key that signs Bodiana for Google Play.
# Run it ONCE, download the result, store it somewhere safe (password manager / offline drive),
# add the four secrets it lists, then DELETE the workflow run and its artifact.
# If you lose this key you will need Google Play support to reset it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        run: |
          mkdir -p out
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -keystore out/upload.jks -storetype PKCS12 -keyalg RSA -keysize 2048 \
            -validity 10000 -alias upload -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Bodiana, O=Bodiana, C=IN"
          base64 -w 0 out/upload.jks > out/ANDROID_KEYSTORE_BASE64.txt
          {
            echo "Add these as GitHub repository secrets (Settings > Secrets and variables > Actions):"
            echo ""
            echo "ANDROID_KEYSTORE_BASE64 = (the whole content of ANDROID_KEYSTORE_BASE64.txt)"
            echo "ANDROID_KEYSTORE_PASSWORD = $PASS"
            echo "ANDROID_KEY_ALIAS = upload"
            echo "ANDROID_KEY_PASSWORD = $PASS"
            echo ""
            echo "Keep upload.jks and this file safe. Then delete this workflow run."
          } > out/SECRETS-README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bodiana-upload-keystore-KEEP-PRIVATE
          path: out/
          retention-days: 1
